name: Build ESP32 bin
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install core and libs
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@2.0.17 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install "Adafruit SSD1306" "Adafruit GFX Library" "Adafruit BusIO"
      - name: Compile
        run: |
          mkdir EngineSim
          cp EngineSim.ino EngineSim/EngineSim.ino
          arduino-cli compile --fqbn esp32:esp32:esp32:PartitionScheme=huge_app --output-dir out EngineSim
          ls -la out
      - name: Merge into one bin
        run: |
          pip install esptool
          BOOTAPP=$(find ~/.arduino15 -name boot_app0.bin | head -1)
          python3 -m esptool --chip esp32 merge_bin -o EngineSim_FULL.bin \
            --flash_mode dio --flash_freq 80m --flash_size 4MB \
            0x1000 out/EngineSim.ino.bootloader.bin \
            0x8000 out/EngineSim.ino.partitions.bin \
            0xe000 "$BOOTAPP" \
            0x10000 out/EngineSim.ino.bin
          ls -la EngineSim_FULL.bin
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-bin
          name: EngineSim firmware (flash at 0x0)
          files: EngineSim_FULL.bin
