name: Build ESP32 bin
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install core and libs
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17
          arduino-cli lib install "Adafruit SSD1306" "Adafruit GFX Library" "Adafruit BusIO"
      - name: Compile
        run: |
          mkdir EngineSim
          cp EngineSim.ino EngineSim/EngineSim.ino
          arduino-cli compile --fqbn esp32:esp32:esp32:PartitionScheme=huge_app --output-dir out EngineSim
          cp out/EngineSim.ino.merged.bin EngineSim_FULL.bin
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-bin
          name: EngineSim firmware (flash at 0x0)
          files: EngineSim_FULL.bin
